<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wattermelon - арбуз зреет</title>
<meta name="description" content="Скоро здесь появится Wattermelon - приложение для велосипедистов. Пока ждёшь - накрути ватт.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Wattermelon">
<meta property="og:description" content="Приложение для велосипедистов: тренировки, топливо и компания на заезд.">
<meta property="og:locale" content="ru_RU">
<meta property="og:image" content="https://wattermelon.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0d0a">
<style>
  :root { --bg:#0b0d0a; --text:#eef3e8; --muted:#8f9a87; --lime:#b6f23a; --flesh:#ff4d5e; --flesh-dark:#2a1517; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 20px; text-align:center; -webkit-tap-highlight-color:transparent;
    background-image:radial-gradient(ellipse at 50% 60%, rgba(182,242,58,.07), transparent 60%);
  }
  .logo { font-weight:800; font-size:22px; letter-spacing:-.02em; margin-bottom:28px; }
  .logo b { color:var(--lime); }
  h1 { white-space:nowrap; font-size:min(68px, 8.4vw); line-height:1.02; letter-spacing:-.035em; margin:0 0 14px; }
  .sub { color:var(--muted); max-width:460px; margin:0 auto 8px; }

  .gauge { width:min(420px,92vw); margin:18px auto 0; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  .gauge svg { width:100%; display:block; overflow:visible; }
  .gauge:active .slice { transform:scale(.985); }
  .slice { transform-origin:200px 200px; transition:transform .08s; }
  #needle { transform-origin:200px 200px; transform:rotate(-90deg); }

  .watts { font-variant-numeric:tabular-nums; font-weight:800; font-size:56px; letter-spacing:-.03em; line-height:1; margin-top:-6px; }
  .watts small { font-size:22px; color:var(--muted); font-weight:600; margin-left:4px; }
  .zone { color:var(--lime); font-weight:600; min-height:26px; margin-top:6px; }
  .hint { color:var(--muted); font-size:14px; margin-top:4px; }
  .peak { color:var(--muted); font-size:14px; min-height:21px; }
  .msg { min-height:48px; max-width:420px; margin:14px auto 0; font-weight:600; opacity:0; transition:opacity .4s; }
  .msg.on { opacity:1; }

  footer { margin-top:34px; color:var(--muted); font-size:14px; }
  footer a { color:var(--muted); }
  /* Одинаковая высота блоков на обоих языках: при переключении ничего не прыгает. */
  body { justify-content:flex-start; padding-top:max(56px, 8vh); }
  .sub { min-height:4.5em; }
  .hint { min-height:3em; }
  footer { margin-top:auto; padding-top:34px; }
</style>
<style>
  .lang { position:fixed; top:max(14px, env(safe-area-inset-top)); right:max(14px, env(safe-area-inset-right)); z-index:50;
    display:flex; gap:2px; padding:3px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
    font:700 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing:.08em; }
  .lang a { color:#8f9a87; text-decoration:none; padding:6px 9px; border-radius:999px; }
  .lang a[aria-current] { background:#c7ff0d; color:#0b0d0a; }
  .lang a:not([aria-current]):hover { color:#eef3e8; }
  @media (max-width:560px) { body { padding-top:68px !important; } }
</style>
</head>
<body>
<nav class="lang" aria-label="Language"><a href="/" data-l="en" onclick="this.href += location.hash;">EN</a><a href="/ru/" data-l="ru" onclick="this.href += location.hash;" aria-current="true">RU</a></nav>


<div class="logo"><img src="/logo-mark.svg" alt="" width="34" height="34" style="vertical-align:-9px;margin-right:9px"><b>Watt</b>ermelon</div>
<h1>Арбуз зреет.</h1>
<p class="sub">Скоро здесь появится приложение для велосипедистов: тренировки, топливо и компания на заезд. Пока ждёшь - накрути ватт.</p>

<div class="gauge" id="gauge" role="button" tabindex="0" aria-label="Жми, чтобы крутить педали">
  <svg viewBox="0 0 400 215" aria-hidden="true">
    <g class="slice">
      <!-- корка -->
      <path d="M 18 200 A 182 182 0 0 1 382 200" fill="none" stroke="var(--lime)" stroke-width="14" stroke-linecap="round"/>
      <path d="M 29 200 A 171 171 0 0 1 371 200" fill="none" stroke="#e9f5d6" stroke-opacity=".22" stroke-width="6"/>
      <!-- мякоть: тёмная основа и спелая часть -->
      <path d="M 61 200 A 139 139 0 0 1 339 200" fill="none" stroke="var(--flesh-dark)" stroke-width="58"/>
      <path id="ripe" d="M 61 200 A 139 139 0 0 1 339 200" fill="none" stroke="var(--flesh)" stroke-width="58" pathLength="100" stroke-dasharray="0 100"/>
      <!-- косточки = деления шкалы -->
      <g id="seeds" fill="#0b0d0a"></g>
      <!-- срез -->
      <line x1="10" y1="200" x2="390" y2="200" stroke="var(--lime)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="needle">
      <line x1="200" y1="200" x2="200" y2="52" stroke="var(--text)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle cx="200" cy="200" r="11" fill="var(--text)"/>
    <circle cx="200" cy="200" r="4" fill="var(--bg)"/>
  </svg>
</div>

<div class="watts"><span id="w">0</span><small>W</small></div>
<div class="zone" id="zone">Зелёный. Крути!</div>
<div class="hint" id="hint">Жми на арбуз (или пробел). Чем чаще - тем спелее.</div>
<div class="peak" id="peak"></div>
<div class="msg" id="msg"></div>

<footer>© 2026 Wattermelon · <a href="/ru/privacy/">Конфиденциальность</a> · <a href="/ru/terms/">Условия</a> · <a href="mailto:hello@wattermelon.com">hello@wattermelon.com</a></footer>

<script>
(function () {
  var MAX = 500;
  var watts = 0, peak = 0, ripeShown = false, holding = null;
  var el = {
    w: document.getElementById('w'), zone: document.getElementById('zone'),
    peak: document.getElementById('peak'), msg: document.getElementById('msg'),
    hint: document.getElementById('hint'), ripe: document.getElementById('ripe'),
    needle: document.getElementById('needle'), gauge: document.getElementById('gauge'),
    seeds: document.getElementById('seeds')
  };

  // косточки по дуге - заодно деления шкалы
  for (var i = 1; i < 10; i++) {
    var a = Math.PI - (Math.PI * i / 10);
    var r = i % 2 ? 128 : 150;
    var x = 200 + r * Math.cos(a), y = 200 - r * Math.sin(a);
    var deg = 90 - (a * 180 / Math.PI);
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    s.setAttribute('cx', x.toFixed(1)); s.setAttribute('cy', y.toFixed(1));
    s.setAttribute('rx', '4'); s.setAttribute('ry', '7');
    s.setAttribute('transform', 'rotate(' + deg.toFixed(1) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')');
    el.seeds.appendChild(s);
  }

  var zones = [
    [450, 'Спелый! Максимум сочности'],
    [350, 'VO2max. Держись!'],
    [250, 'Порог. Уже краснеет'],
    [150, 'Темп. Наливается'],
    [50,  'Разминка. Розовеет'],
    [0,   'Зелёный. Крути!']
  ];
  var lines = [
    'Вот это ватты. Приложение созреет так же быстро.',
    'Сочно. Скоро сможешь записать это в настоящий заезд.',
    'Спелый! Теперь не забудь про топливо.'
  ];

  function push() {
    watts = Math.min(MAX, watts + 32 + Math.random() * 10);
    el.hint.style.opacity = '0';
  }
  function start(e) {
    if (e) e.preventDefault();
    push();
    clearInterval(holding);
    holding = setInterval(push, 160);
  }
  function stop() { clearInterval(holding); holding = null; }

  el.gauge.addEventListener('pointerdown', start);
  window.addEventListener('pointerup', stop);
  window.addEventListener('pointercancel', stop);
  window.addEventListener('keydown', function (e) {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); push(); }
  });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(64, now - last); last = now;
    if (!holding) watts = Math.max(0, watts - (watts * 0.0016 + 0.09) * dt);
    var p = watts / MAX;
    el.ripe.setAttribute('stroke-dasharray', (p * 100).toFixed(2) + ' 100');
    el.needle.style.transform = 'rotate(' + (-90 + 180 * p).toFixed(2) + 'deg)';
    var shown = Math.round(watts);
    el.w.textContent = shown;
    for (var i = 0; i < zones.length; i++) if (shown >= zones[i][0]) { el.zone.textContent = zones[i][1]; break; }
    if (shown > peak) { peak = shown; if (peak > 40) el.peak.textContent = 'Твой пик: ' + peak + ' W'; }
    if (shown >= 450 && !ripeShown) {
      ripeShown = true;
      el.msg.textContent = lines[Math.floor(Math.random() * lines.length)];
      el.msg.classList.add('on');
    }
    if (shown < 120 && ripeShown) { ripeShown = false; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
